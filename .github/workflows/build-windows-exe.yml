name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Find entry and build
        shell: powershell
        run: |
          if (Test-Path main.py) {
            pyinstaller --noconfirm --clean --onefile --name AI_Fund_Predictor main.py
          } elseif (Test-Path app.py) {
            pyinstaller --noconfirm --clean --onefile --name AI_Fund_Predictor app.py
          } else {
            Write-Error '未找到 main.py 或 app.py，请根据源码入口调整 workflow'
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AI_Fund_Predictor_Windows_EXE
          path: dist/*.exe

name: Build AI Fund Predictor V0.7

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'v0.7/**'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository without marketplace actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "${GITHUB_SHA}"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld unzip zip

      - name: Prepare V0.7 source
        run: |
          set -euo pipefail
          cd repo
          SRC_ZIP="$(find . -maxdepth 1 -type f -name 'AI_Fund_Predictor_V0.6_Source*.zip' | head -n 1)"
          test -n "$SRC_ZIP"
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q "$SRC_ZIP" -d buildsrc
          python3 v0.7/apply_v07.py buildsrc

      - name: Build Windows x64 EXE
        run: |
          set -euo pipefail
          cd repo/buildsrc
          chmod +x build_windows.sh
          CLANG="$(command -v clang-cl)" LINK="$(command -v lld-link)" ./build_windows.sh
          test -f "AI基金预测_V0.7_AI经验闭环基础版_免安装.exe"

      - name: Package release
        run: |
          set -euo pipefail
          cd repo
          rm -rf release/V0.7
          mkdir -p release/V0.7
          cp "buildsrc/AI基金预测_V0.7_AI经验闭环基础版_免安装.exe" "release/V0.7/AI_Fund_Predictor_V0.7_Portable.exe"
          (
            cd buildsrc
            zip -qr ../release/V0.7/AI_Fund_Predictor_V0.7_Source.zip README.md build_windows.sh src tests
          )
          sha256sum release/V0.7/AI_Fund_Predictor_V0.7_Portable.exe release/V0.7/AI_Fund_Predictor_V0.7_Source.zip > release/V0.7/SHA256.txt
          cat > release/V0.7/TEST_REPORT_V0.7.txt <<'EOF'
AI基金预测 V0.7 GitHub Actions 构建报告
PASS - V0.6 baseline extracted
PASS - V0.7 experience overlay applied
PASS - Windows x64 PE built with clang-cl/lld-link
PASS - Portable EXE packaged
PASS - Source ZIP packaged
EOF

      - name: Publish build files back to repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/V0.7
          if git diff --cached --quiet; then
            echo "No release changes"
            exit 0
          fi
          git commit -m "Build V0.7 Windows EXE and source"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
